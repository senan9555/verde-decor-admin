<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERDE DECOR — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f2;
  color:#17251b
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 10px 35px #0001
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#285b35;
  margin-bottom:8px
}

.muted{
  color:#718076
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5ddd7;
  border-radius:11px;
  outline:none;
  background:white
}

textarea{
  min-height:100px;
  resize:vertical
}

input:focus,
select:focus,
textarea:focus{
  border-color:#4d8658
}

.btn{
  border:0;
  border-radius:11px;
  padding:13px 17px;
  background:#285b35;
  color:white;
  font-weight:700
}

.btn.secondary{
  background:#e9eee9;
  color:#285b35
}

.btn.danger{
  background:#b83c3c
}

.full{
  width:100%;
  margin-top:18px
}

.error{
  color:#b42318;
  background:#fff0ef;
  padding:10px;
  border-radius:9px;
  margin-top:12px;
  display:none
}

.app{
  display:none;
  min-height:100vh
}

header{
  background:#183b23;
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

header strong{
  font-size:19px
}

.logout{
  background:#ffffff18;
  border:1px solid #ffffff40;
  color:white;
  padding:9px 13px;
  border-radius:9px
}

main{
  max-width:1000px;
  margin:auto;
  padding:20px
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px;
  padding-bottom:3px
}

.tab{
  border:0;
  padding:11px 15px;
  border-radius:10px;
  background:#e4ebe5;
  color:#284a31;
  white-space:nowrap
}

.tab.active{
  background:#285b35;
  color:white
}

.panel{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #00000008;
  margin-bottom:20px
}

.panel h2{
  margin-top:0
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px
}

.card{
  border:1px solid #e0e6e1;
  border-radius:14px;
  overflow:hidden;
  background:white
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block
}

.card-body{
  padding:13px
}

.card h3{
  margin:0 0 6px
}

.price{
  font-weight:800;
  color:#285b35
}

.actions{
  display:flex;
  gap:7px;
  margin-top:12px
}

.actions button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:9px
}

.empty{
  padding:25px;
  text-align:center;
  color:#718076
}

.preview{
  margin-top:12px;
  width:180px;
  height:180px;
  border-radius:12px;
  object-fit:contain;
  background:#f1f4f1;
  display:none
}

.status{
  padding:10px;
  border-radius:9px;
  margin-top:12px;
  display:none
}

.status.ok{
  background:#eaf6ec;
  color:#236332
}

.status.bad{
  background:#fff0ef;
  color:#9d2828
}

.section-note{
  color:#718076;
  margin-top:-8px;
  margin-bottom:18px
}

/* PORTFOLIO */

.portfolio-card{
  position:relative
}

.portfolio-image-wrap{
  width:100%;
  height:240px;
  background:#eef2ee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}

.portfolio-image-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  cursor:pointer;
  background:#eef2ee
}

.portfolio-image-error{
  width:100%;
  height:240px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#eef2ee;
  color:#718076;
  text-align:center;
  padding:15px
}

.image-link{
  display:block;
  text-align:center;
  margin-top:9px;
  color:#285b35;
  font-weight:700;
  text-decoration:none;
  background:#edf3ee;
  padding:9px;
  border-radius:8px
}

/* IMAGE MODAL */

.image-modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:9999
}

.image-modal.show{
  display:flex
}

.image-modal-content{
  width:min(950px,100%);
  max-height:90vh;
  background:white;
  border-radius:18px;
  padding:15px;
  position:relative;
  overflow:auto
}

.image-modal-content img{
  width:100%;
  max-height:70vh;
  object-fit:contain;
  display:block;
  background:#f1f4f1;
  border-radius:12px
}

.image-modal-title{
  font-size:20px;
  font-weight:800;
  margin:13px 0 5px
}

.image-modal-description{
  color:#718076;
  margin:0
}

.modal-close{
  position:absolute;
  top:10px;
  right:10px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#183b23;
  color:white;
  font-size:22px;
  z-index:2
}

@media(max-width:700px){

  .grid,
  .product-grid{
    grid-template-columns:1fr
  }

  main{
    padding:13px
  }

  .panel{
    padding:15px
  }

  header{
    padding:14px
  }

  header strong{
    font-size:16px
  }

  .tabs{
    margin-bottom:14px
  }

  .portfolio-image-wrap{
    height:240px
  }

  .image-modal{
    padding:10px
  }

  .image-modal-content{
    border-radius:14px;
    padding:10px
  }
}
</style>
</head>

<!-- IMAGE MODAL -->

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://yxhiqqcninhgwcwgpaen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BovYZI2LdinlHZMOAylVqg_lMXAa9tQ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
   ===================================================== */

let editingId = null;
let oldImageUrl = "";

let editingPortfolioId = null;
let oldPortfolioImageUrl = "";


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginError =
  document.getElementById("loginError");

const productsList =
  document.getElementById("productsList");

const productForm =
  document.getElementById("productForm");

const productName =
  document.getElementById("productName");

const productCategory =
  document.getElementById("productCategory");

const productPrice =
  document.getElementById("productPrice");

const productDescription =
  document.getElementById("productDescription");

const productImage =
  document.getElementById("productImage");

const preview =
  document.getElementById("preview");

const formStatus =
  document.getElementById("formStatus");

const formTitle =
  document.getElementById("formTitle");

const portfolioList =
  document.getElementById("portfolioList");

const portfolioForm =
  document.getElementById("portfolioForm");

const portfolioTitle =
  document.getElementById("portfolioTitle");

const portfolioDescription =
  document.getElementById("portfolioDescription");

const portfolioImage =
  document.getElementById("portfolioImage");

const portfolioPreview =
  document.getElementById("portfolioPreview");

const portfolioFormStatus =
  document.getElementById("portfolioFormStatus");

const portfolioFormTitle =
  document.getElementById("portfolioFormTitle");

const imageModal =
  document.getElementById("imageModal");

const modalImage =
  document.getElementById("modalImage");

const modalTitle =
  document.getElementById("modalTitle");

const modalDescription =
  document.getElementById("modalDescription");


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
  element,
  message,
  good=true
){

  element.textContent =
    message;

  element.className =
    "status " +
    (good ? "ok" : "bad");

  element.style.display =
    "block";
}


function clearStatus(element){

  element.style.display =
    "none";

}


/* =====================================================
   APP
   ===================================================== */

function showApp(){

  loginScreen.style.display =
    "none";

  app.style.display =
    "block";

  loadProducts();
  loadPortfolio();

}


function showLogin(){

  app.style.display =
    "none";

  loginScreen.style.display =
    "flex";

}


/* =====================================================
   SESSION
   ===================================================== */

async function checkSession(){

  const {data} =
    await client.auth.getSession();

  if(data.session){

    showApp();

  }else{

    showLogin();

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async ()=>{

      loginError.style.display =
        "none";

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      if(!email || !password){

        loginError.textContent =
          "Email və şifrəni daxil et.";

        loginError.style.display =
          "block";

        return;

      }

      const {error} =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if(error){

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";

        return;

      }

      showApp();

    }
  );


/* =====================================================
   LOGOUT
   ===================================================== */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async ()=>{

      await client.auth.signOut();

      showLogin();

    }
  );


/* =====================================================
   TABS
   ===================================================== */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.addEventListener(
      "click",
      ()=>{
        openPage(
          tab.dataset.page
        );
      }
    );

  });


function openPage(page){

  document
    .querySelectorAll(".tab")
    .forEach(x=>{
      x.classList.remove(
        "active"
      );
    });


  const activeTab =
    document.querySelector(
      '[data-page="' +
      page +
      '"]'
    );


  if(activeTab){

    activeTab.classList.add(
      "active"
    );

  }


  const pages = [
    "productsPage",
    "addPage",
    "portfolioPage",
    "portfolioAddPage"
  ];


  pages.forEach(pageId=>{

    const element =
      document.getElementById(
        pageId
      );

    if(element){

      element.style.display =
        pageId === page
          ? "block"
          : "none";

    }

  });


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   PRODUCT PREVIEW
   ===================================================== */

productImage.addEventListener(
  "change",
  ()=>{

    const file =
      productImage.files[0];

    if(!file){

      if(oldImageUrl){

        preview.src =
          oldImageUrl;

        preview.style.display =
          "block";

      }else{

        preview.style.display =
          "none";

      }

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e=>{

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   PORTFOLIO PREVIEW
   ===================================================== */

portfolioImage.addEventListener(
  "change",
  ()=>{

    const file =
      portfolioImage.files[0];

    if(!file){

      if(oldPortfolioImageUrl){

        portfolioPreview.src =
          oldPortfolioImageUrl;

        portfolioPreview.style.display =
          "block";

      }else{

        portfolioPreview.style.display =
          "none";

      }

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e=>{

        portfolioPreview.src =
          e.target.result;

        portfolioPreview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts(){

  productsList.innerHTML =
    '<div class="empty">Məhsullar yüklənir...</div>';


  const {data,error} =
    await client
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    productsList.innerHTML =
      '<div class="empty">Xəta: ' +
      escapeHtml(error.message) +
      '</div>';

    return;

  }


  if(!data || data.length === 0){

    productsList.innerHTML =
      '<div class="empty">Hələ məhsul yoxdur.</div>';

    return;

  }


  productsList.innerHTML =
    data.map(product=>{

      const image =
        product.image_url
          ? `
            <img
              src="${escapeAttr(product.image_url)}"
              alt="${escapeAttr(product.name)}"
              loading="lazy"
            >
          `
          : `
            <div
              style="
                height:180px;
                display:flex;
                align-items:center;
                justify-content:center;
                background:#edf1ed;
                font-size:50px
              ">
              🌿
            </div>
          `;


      return `
        <article class="card">

          ${image}

          <div class="card-body">

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <div class="muted">
              ${escapeHtml(
                categoryName(product.category)
              )}
            </div>

            <p class="price">
              ${Number(
                product.price || 0
              ).toFixed(2)}
              AZN
            </p>

            <p>
              ${escapeHtml(
                product.description || ""
              )}
            </p>

            <div class="actions">

              <button
                style="
                  background:#e9eee9;
                  color:#285b35
                "
                onclick="editProduct('${product.id}')">
                Redaktə
              </button>

              <button
                style="
                  background:#ffe9e9;
                  color:#a22
                "
                onclick="deleteProduct('${product.id}')">
                Sil
              </button>

            </div>

          </div>

        </article>
      `;

    }).join("");

}


/* =====================================================
   CATEGORY
   ===================================================== */

function categoryName(category){

  const names = {
    tree:"Süni ağaclar",
    flower:"Güllər / Kompozisiya",
    wall:"Yaşıl divar",
    pot:"Dibçək"
  };

  return names[category] || category;

}


/* =====================================================
   UPLOAD
   ===================================================== */

async function uploadImage(
  file,
  folder="products"
){

  if(!file){

    if(folder === "portfolio"){

      return oldPortfolioImageUrl || "";

    }

    return oldImageUrl || "";

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const safeExtension =
    [
      "jpg",
      "jpeg",
      "png",
      "webp",
      "gif"
    ].includes(extension)
      ? extension
      : "jpg";


  const fileName =
    crypto.randomUUID() +
    "." +
    safeExtension;


  const path =
    folder +
    "/" +
    fileName;


  const {error} =
    await client.storage
      .from("product-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    throw new Error(
      "Şəkil yüklənmədi: " +
      error.message
    );

  }


  const {data} =
    client.storage
      .from("product-images")
      .getPublicUrl(path);


  if(!data || !data.publicUrl){

    throw new Error(
      "Şəkilin public URL-i alınmadı."
    );

  }


  return data.publicUrl;

}


/* =====================================================
   STORAGE PATH
   ===================================================== */

function getStoragePathFromUrl(url){

  if(!url) return null;


  try{

    const marker =
      "/storage/v1/object/public/product-images/";


    const index =
      url.indexOf(marker);


    if(index === -1){

      return null;

    }


    return decodeURIComponent(
      url.substring(
        index + marker.length
      )
    );

  }catch(error){

    return null;

  }

}


/* =====================================================
   DELETE STORAGE IMAGE
   ===================================================== */

async function deleteImageFromStorage(url){

  const path =
    getStoragePathFromUrl(url);


  if(!path){

    return;

  }


  const {error} =
    await client.storage
      .from("product-images")
      .remove([
        path
      ]);


  if(error){

    throw new Error(
      "Şəkil Storage-dan silinmədi: " +
      error.message
    );

  }

}

/* =====================================================
   LOAD PORTFOLIO
   ===================================================== */

async function loadPortfolio(){

  portfolioList.innerHTML =
    '<div class="empty">Nümunələr yüklənir...</div>';


  const {data,error} =
    await client
      .from("portfolio")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    portfolioList.innerHTML =
      '<div class="empty">Xəta: ' +
      escapeHtml(error.message) +
      '</div>';

    return;

  }


  if(!data || data.length === 0){

    portfolioList.innerHTML =
      `
      <div class="empty">
        Hələ nümunə layihəsi yoxdur.
        <br><br>
        Yuxarıdan "Nümunə əlavə et" bölməsinə keç.
      </div>
      `;

    return;

  }


  portfolioList.innerHTML =
    data.map(item=>{

      const safeUrl =
        item.image_url
          ? escapeAttr(item.image_url)
          : "";


      let imageBlock;


      if(item.image_url){

        imageBlock = `
          <div class="portfolio-image-wrap">

            <img
              src="${safeUrl}"
              alt="${escapeAttr(item.title || "Nümunə")}"
              loading="lazy"
              onclick="openPortfolioImage(
                '${escapeJs(item.image_url)}',
                '${escapeJs(item.title || "")}',
                '${escapeJs(item.description || "")}'
              )"
              onerror="portfolioImageError(this)"
            >

          </div>

          <a
            class="image-link"
            href="${safeUrl}"
            target="_blank"
            rel="noopener noreferrer">

            🖼️ Şəkilə bax

          </a>
        `;

      }else{

        imageBlock = `
          <div class="portfolio-image-error">

            <div style="font-size:45px">
              🌿
            </div>

            <strong>
              Şəkil yoxdur
            </strong>

          </div>
        `;

      }


      return `
        <article
          class="card portfolio-card">

          ${imageBlock}

          <div class="card-body">

            <h3>
              ${escapeHtml(
                item.title || "Adsız layihə"
              )}
            </h3>

            <p>
              ${escapeHtml(
                item.description || ""
              )}
            </p>

            <div class="actions">

              <button
                style="
                  background:#e9eee9;
                  color:#285b35
                "
                onclick="editPortfolio('${item.id}')">

                Redaktə

              </button>

              <button
                style="
                  background:#ffe9e9;
                  color:#a22
                "
                onclick="deletePortfolio('${item.id}')">

                Sil

              </button>

            </div>

          </div>

        </article>
      `;

    }).join("");

}

/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =====================================================
   JS STRING ESCAPE
   ===================================================== */

function escapeJs(value){

  return String(
    value ?? ""
  )
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'")
    .replaceAll("\n"," ")
    .replaceAll("\r"," ");

}
