<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VERDE DECOR — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f2;
  color:#17251b
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 10px 35px #0001
}
.logo{
  font-size:25px;
  font-weight:800;
  color:#285b35;
  margin-bottom:8px
}
.muted{color:#718076}
label{
  display:block;
  font-weight:700;
  margin:16px 0 7px
}
input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d5ddd7;
  border-radius:11px;
  outline:none;
  background:white
}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{
  border-color:#4d8658
}
.btn{
  border:0;
  border-radius:11px;
  padding:13px 17px;
  background:#285b35;
  color:white;
  font-weight:700
}
.btn.secondary{
  background:#e9eee9;
  color:#285b35
}
.btn.danger{
  background:#b83c3c
}
.full{width:100%;margin-top:18px}
.error{
  color:#b42318;
  background:#fff0ef;
  padding:10px;
  border-radius:9px;
  margin-top:12px;
  display:none
}
.app{display:none;min-height:100vh}
header{
  background:#183b23;
  color:white;
  padding:16px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
header strong{font-size:19px}
.logout{
  background:#ffffff18;
  border:1px solid #ffffff40;
  color:white;
  padding:9px 13px;
  border-radius:9px
}
main{
  max-width:1000px;
  margin:auto;
  padding:20px
}
.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px
}
.tab{
  border:0;
  padding:11px 15px;
  border-radius:10px;
  background:#e4ebe5;
  color:#284a31;
  white-space:nowrap
}
.tab.active{
  background:#285b35;
  color:white
}
.panel{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #00000008;
  margin-bottom:20px
}
.panel h2{margin-top:0}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px
}
.product-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px
}
.card{
  border:1px solid #e0e6e1;
  border-radius:14px;
  overflow:hidden;
  background:white
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  display:block
}
.card-body{padding:13px}
.card h3{margin:0 0 6px}
.price{font-weight:800;color:#285b35}
.actions{
  display:flex;
  gap:7px;
  margin-top:12px
}
.actions button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:9px
}
.empty{
  padding:25px;
  text-align:center;
  color:#718076
}
.preview{
  margin-top:12px;
  max-width:180px;
  max-height:180px;
  border-radius:12px;
  object-fit:cover;
  display:none
}
.status{
  padding:10px;
  border-radius:9px;
  margin-top:12px;
  display:none
}
.status.ok{
  background:#eaf6ec;
  color:#236332
}
.status.bad{
  background:#fff0ef;
  color:#9d2828
}
@media(max-width:700px){
  .grid,.product-grid{grid-template-columns:1fr}
  main{padding:13px}
  .panel{padding:15px}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section class="login" id="loginScreen">
  <div class="login-box">
    <div class="logo">🌿 VERDE DECOR</div>
    <p class="muted">Admin panel</p>

    <label>Email</label>
    <input id="email" type="email" placeholder="admin@email.com">

    <label>Password</label>
    <input id="password" type="password" placeholder="Şifrə">

    <button class="btn full" id="loginBtn">Daxil ol</button>

    <div class="error" id="loginError"></div>
  </div>
</section>

<!-- APP -->
<section class="app" id="app">
  <header>
    <strong>🌿 VERDE DECOR Admin</strong>
    <button class="logout" id="logoutBtn">Çıxış</button>
  </header>

  <main>

    <div class="tabs">
      <button class="tab active" data-page="productsPage">Məhsullar</button>
      <button class="tab" data-page="addPage">Məhsul əlavə et</button>
    </div>

    <!-- PRODUCTS -->
    <section id="productsPage">
      <div class="panel">
        <h2>Məhsullar</h2>
        <div id="productsList" class="product-grid">
          <div class="empty">Yüklənir...</div>
        </div>
      </div>
    </section>

    <!-- ADD / EDIT -->
    <section id="addPage" style="display:none">
      <div class="panel">
        <h2 id="formTitle">Yeni məhsul</h2>

        <form id="productForm">

          <label>Məhsul adı</label>
          <input id="productName" required placeholder="Məsələn: Zeytun ağacı">

          <label>Kateqoriya</label>
          <select id="productCategory" required>
            <option value="tree">Süni ağaclar</option>
            <option value="flower">Güllər / Kompozisiya</option>
            <option value="wall">Yaşıl divar</option>
            <option value="pot">Dibçək</option>
          </select>

          <label>Qiymət</label>
          <input id="productPrice" type="number" min="0" step="0.01" placeholder="0">

          <label>Təsvir</label>
          <textarea id="productDescription" placeholder="Məhsul haqqında qısa məlumat"></textarea>

          <label>Şəkil</label>
          <input id="productImage" type="file" accept="image/*">

          <img id="preview" class="preview" alt="Şəkil önizləməsi">

          <div class="actions">
            <button type="submit" class="btn" id="saveBtn">Məhsulu yadda saxla</button>
            <button type="button" class="btn secondary" id="cancelBtn">Ləğv et</button>
          </div>

          <div class="status" id="formStatus"></div>

        </form>
      </div>
    </section>

  </main>
</section>

<script>
/* =====================================================
   SUPABASE AYARLARI
   BURADA YALNIZ 2 YERİ DƏYİŞ:
   1. SUPABASE_URL
   2. SUPABASE_KEY
   ===================================================== */

const SUPABASE_URL = "https://yxhiqqcninhgwcwgpaen.supabase.co";
const SUPABASE_KEY = "sb_publishable_BovYZI2LdinlHZMOAylVqg_lMXAa9tQ ";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let oldImageUrl = "";

const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const loginError = document.getElementById("loginError");
const productsList = document.getElementById("productsList");

const productForm = document.getElementById("productForm");
const productName = document.getElementById("productName");
const productCategory = document.getElementById("productCategory");
const productPrice = document.getElementById("productPrice");
const productDescription = document.getElementById("productDescription");
const productImage = document.getElementById("productImage");
const preview = document.getElementById("preview");
const formStatus = document.getElementById("formStatus");
const formTitle = document.getElementById("formTitle");

function showStatus(message, good=true){
  formStatus.textContent = message;
  formStatus.className = "status " + (good ? "ok" : "bad");
  formStatus.style.display = "block";
}

function clearStatus(){
  formStatus.style.display = "none";
}

function showApp(){
  loginScreen.style.display = "none";
  app.style.display = "block";
  loadProducts();
}

function showLogin(){
  app.style.display = "none";
  loginScreen.style.display = "flex";
}

async function checkSession(){
  const {data} = await client.auth.getSession();

  if(data.session){
    showApp();
  }else{
    showLogin();
  }
}

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  loginError.style.display = "none";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    loginError.textContent = "Email və şifrəni daxil et.";
    loginError.style.display = "block";
    return;
  }

  const {error} = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    loginError.textContent = error.message;
    loginError.style.display = "block";
    return;
  }

  showApp();
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await client.auth.signOut();
  showLogin();
});

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");

    document.getElementById("productsPage").style.display =
      tab.dataset.page === "productsPage" ? "block" : "none";

    document.getElementById("addPage").style.display =
      tab.dataset.page === "addPage" ? "block" : "none";

    if(tab.dataset.page === "addPage"){
      clearStatus();
    }
  });
});

productImage.addEventListener("change", ()=>{
  const file = productImage.files[0];

  if(!file){
    preview.style.display = "none";
    return;
  }

  const reader = new FileReader();

  reader.onload = e=>{
    preview.src = e.target.result;
    preview.style.display = "block";
  };

  reader.readAsDataURL(file);
});

async function loadProducts(){

  productsList.innerHTML =
    '<div class="empty">Məhsullar yüklənir...</div>';

  const {data, error} = await client
    .from("products")
    .select("*")
    .order("created_at", {ascending:false});

  if(error){
    productsList.innerHTML =
      '<div class="empty">Xəta: ' +
      escapeHtml(error.message) +
      '</div>';
    return;
  }

  if(!data || data.length === 0){
    productsList.innerHTML =
      '<div class="empty">Hələ məhsul yoxdur.</div>';
    return;
  }

  productsList.innerHTML = data.map(product=>{

    const image = product.image_url
      ? `<img src="${escapeAttr(product.image_url)}" alt="${escapeAttr(product.name)}">`
      : `<div style="height:180px;display:flex;align-items:center;justify-content:center;background:#edf1ed;font-size:50px">🌿</div>`;

    return `
      <article class="card">
        ${image}

        <div class="card-body">
          <h3>${escapeHtml(product.name)}</h3>

          <div class="muted">
            ${escapeHtml(categoryName(product.category))}
          </div>

          <p class="price">
            ${Number(product.price || 0).toFixed(2)} AZN
          </p>

          <p>
            ${escapeHtml(product.description || "")}
          </p>

          <div class="actions">
            <button
              style="background:#e9eee9;color:#285b35"
              onclick="editProduct('${product.id}')">
              Redaktə
            </button>

            <button
              style="background:#ffe9e9;color:#a22"
              onclick="deleteProduct('${product.id}')">
              Sil
            </button>
          </div>
        </div>
      </article>
    `;
  }).join("");
}

function categoryName(category){
  const names = {
    tree:"Süni ağaclar",
    flower:"Güllər / Kompozisiya",
    wall:"Yaşıl divar",
    pot:"Dibçək"
  };

  return names[category] || category;
}

async function uploadImage(file){

  if(!file) return oldImageUrl || "";

  const extension =
    file.name.split(".").pop().toLowerCase();

  const safeExtension =
    ["jpg","jpeg","png","webp","gif"].includes(extension)
      ? extension
      : "jpg";

  const fileName =
    crypto.randomUUID() + "." + safeExtension;

  const path = "products/" + fileName;

  const {error} = await client.storage
    .from("product-images")
    .upload(path, file, {
      cacheControl:"3600",
      upsert:false
    });

  if(error){
    throw new Error("Şəkil yüklənmədi: " + error.message);
  }

  const {data} = client.storage
    .from("product-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

productForm.addEventListener("submit", async e=>{

  e.preventDefault();
  clearStatus();

  const saveBtn = document.getElementById("saveBtn");

  saveBtn.disabled = true;
  saveBtn.textContent = "Yadda saxlanılır...";

  try{

    const file = productImage.files[0];

    const imageUrl = await uploadImage(file);

    const payload = {
      name: productName.value.trim(),
      category: productCategory.value,
      price: Number(productPrice.value || 0),
      description: productDescription.value.trim(),
      image_url: imageUrl
    };

    if(!payload.name){
      throw new Error("Məhsul adını yaz.");
    }

    let result;

    if(editingId){

      result = await client
        .from("products")
        .update(payload)
        .eq("id", editingId);

    }else{

      result = await client
        .from("products")
        .insert(payload);

    }

    if(result.error){
      throw result.error;
    }

    showStatus(
      editingId
        ? "Məhsul yeniləndi. ✅"
        : "Məhsul əlavə edildi. ✅"
    );

    resetForm();
    await loadProducts();

  }catch(error){

    showStatus(
      error.message || "Naməlum xəta baş verdi.",
      false
    );

  }finally{

    saveBtn.disabled = false;
    saveBtn.textContent = "Məhsulu yadda saxla";
  }
});

window.editProduct = async function(id){

  const {data, error} = await client
    .from("products")
    .select("*")
    .eq("id", id)
    .single();

  if(error){
    alert(error.message);
    return;
  }

  editingId = id;
  oldImageUrl = data.image_url || "";

  productName.value = data.name || "";
  productCategory.value = data.category || "tree";
  productPrice.value = data.price || 0;
  productDescription.value = data.description || "";

  if(data.image_url){
    preview.src = data.image_url;
    preview.style.display = "block";
  }else{
    preview.style.display = "none";
  }

  formTitle.textContent = "Məhsulu redaktə et";

  document.querySelectorAll(".tab").forEach(x=>{
    x.classList.remove("active");
  });

  document.querySelector('[data-page="addPage"]')
    .classList.add("active");

  document.getElementById("productsPage").style.display = "none";
  document.getElementById("addPage").style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
};

window.deleteProduct = async function(id){

  const ok = confirm(
    "Bu məhsulu silmək istədiyinə əminsən?"
  );

  if(!ok) return;

  const {error} = await client
    .from("products")
    .delete()
    .eq("id", id);

  if(error){
    alert(error.message);
    return;
  }

  await loadProducts();
};

document.getElementById("cancelBtn")
  .addEventListener("click", resetForm);

function resetForm(){

  editingId = null;
  oldImageUrl = "";

  productForm.reset();

  preview.src = "";
  preview.style.display = "none";

  formTitle.textContent = "Yeni məhsul";

  clearStatus();
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

client.auth.onAuthStateChange((_event, session)=>{
  if(session){
    showApp();
  }
});

checkSession();
</script>

</body>
</html>
