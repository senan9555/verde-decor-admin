<style>

.tabs{

.actions button{

}

.status.ok{

}

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://yxhiqqcninhgwcwgpaen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_BovYZI2LdinlHZMOAylVqg_lMXAa9tQ";

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   STATE
   ===================================================== */

let editingId = null;
let oldImageUrl = "";

let editingPortfolioId = null;
let oldPortfolioImageUrl = "";


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const loginError =
  document.getElementById("loginError");

const productsList =
  document.getElementById("productsList");

const productForm =
  document.getElementById("productForm");

const productName =
  document.getElementById("productName");

const productCategory =
  document.getElementById("productCategory");

const productPrice =
  document.getElementById("productPrice");

const productDescription =
  document.getElementById("productDescription");

const productImage =
  document.getElementById("productImage");

const preview =
  document.getElementById("preview");

const formStatus =
  document.getElementById("formStatus");

const formTitle =
  document.getElementById("formTitle");


const portfolioList =
  document.getElementById("portfolioList");

const portfolioForm =
  document.getElementById("portfolioForm");

const portfolioTitle =
  document.getElementById("portfolioTitle");

const portfolioDescription =
  document.getElementById("portfolioDescription");

const portfolioImage =
  document.getElementById("portfolioImage");

const portfolioPreview =
  document.getElementById("portfolioPreview");

const portfolioFormStatus =
  document.getElementById("portfolioFormStatus");

const portfolioFormTitle =
  document.getElementById("portfolioFormTitle");


/* =====================================================
   STATUS HELPERS
   ===================================================== */

function showStatus(
  element,
  message,
  good=true
){

  element.textContent =
    message;

  element.className =
    "status " +
    (good ? "ok" : "bad");

  element.style.display =
    "block";
}


function clearStatus(element){

  element.style.display =
    "none";
}


/* =====================================================
   APP
   ===================================================== */

function showApp(){

  loginScreen.style.display =
    "none";

  app.style.display =
    "block";

  loadProducts();

  loadPortfolio();

}


function showLogin(){

  app.style.display =
    "none";

  loginScreen.style.display =
    "flex";

}


/* =====================================================
   SESSION
   ===================================================== */

async function checkSession(){

  const {data} =
    await client.auth.getSession();

  if(data.session){

    showApp();

  }else{

    showLogin();

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

document
  .getElementById("loginBtn")
  .addEventListener(
    "click",
    async ()=>{

      loginError.style.display =
        "none";

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if(!email || !password){

        loginError.textContent =
          "Email və şifrəni daxil et.";

        loginError.style.display =
          "block";

        return;

      }


      const {error} =
        await client.auth.signInWithPassword({

          email,
          password

        });


      if(error){

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";

        return;

      }


      showApp();

    }
  );


/* =====================================================
   LOGOUT
   ===================================================== */

document
  .getElementById("logoutBtn")
  .addEventListener(
    "click",
    async ()=>{

      await client.auth.signOut();

      showLogin();

    }
  );


/* =====================================================
   TABS
   ===================================================== */

document
  .querySelectorAll(".tab")
  .forEach(tab=>{

    tab.addEventListener(
      "click",
      ()=>{

        openPage(
          tab.dataset.page
        );

      }
    );

  });


function openPage(page){

  document
    .querySelectorAll(".tab")
    .forEach(x=>{
      x.classList.remove(
        "active"
      );
    });


  const activeTab =
    document.querySelector(
      '[data-page="' +
      page +
      '"]'
    );


  if(activeTab){

    activeTab.classList.add(
      "active"
    );

  }


  const pages = [

    "productsPage",
    "addPage",
    "portfolioPage",
    "portfolioAddPage"

  ];


  pages.forEach(pageId=>{

    const element =
      document.getElementById(
        pageId
      );

    if(element){

      element.style.display =
        pageId === page
          ? "block"
          : "none";

    }

  });


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   PRODUCT IMAGE PREVIEW
   ===================================================== */

productImage.addEventListener(
  "change",
  ()=>{

    const file =
      productImage.files[0];


    if(!file){

      if(oldImageUrl){

        preview.src =
          oldImageUrl;

        preview.style.display =
          "block";

      }else{

        preview.style.display =
          "none";

      }

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e=>{

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   PORTFOLIO IMAGE PREVIEW
   ===================================================== */

portfolioImage.addEventListener(
  "change",
  ()=>{

    const file =
      portfolioImage.files[0];


    if(!file){

      if(oldPortfolioImageUrl){

        portfolioPreview.src =
          oldPortfolioImageUrl;

        portfolioPreview.style.display =
          "block";

      }else{

        portfolioPreview.style.display =
          "none";

      }

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e=>{

        portfolioPreview.src =
          e.target.result;

        portfolioPreview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts(){

  productsList.innerHTML =
    '<div class="empty">Məhsullar yüklənir...</div>';


  const {data,error} =
    await client
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    productsList.innerHTML =
      '<div class="empty">Xəta: ' +
      escapeHtml(
        error.message
      ) +
      '</div>';

    return;

  }


  if(!data || data.length === 0){

    productsList.innerHTML =
      '<div class="empty">Hələ məhsul yoxdur.</div>';

    return;

  }


  productsList.innerHTML =
    data
      .map(product=>{

        const image =
          product.image_url

            ? `
              <img
                src="${escapeAttr(
                  product.image_url
                )}"
                alt="${escapeAttr(
                  product.name
                )}"
              >
              `

            : `
              <div
                style="
                  height:180px;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  background:#edf1ed;
                  font-size:50px
                ">
                🌿
              </div>
              `;


        return `
          <article class="card">

            ${image}

            <div class="card-body">

              <h3>
                ${escapeHtml(
                  product.name
                )}
              </h3>

              <div class="muted">
                ${escapeHtml(
                  categoryName(
                    product.category
                  )
                )}
              </div>

              <p class="price">
                ${Number(
                  product.price || 0
                ).toFixed(2)}
                AZN
              </p>

              <p>
                ${escapeHtml(
                  product.description || ""
                )}
              </p>

              <div class="actions">

                <button
                  style="
                    background:#e9eee9;
                    color:#285b35
                  "
                  onclick="editProduct('${product.id}')">

                  Redaktə

                </button>


                <button
                  style="
                    background:#ffe9e9;
                    color:#a22
                  "
                  onclick="deleteProduct('${product.id}')">

                  Sil

                </button>

              </div>

            </div>

          </article>
        `;

      })
      .join("");

}


/* =====================================================
   CATEGORY NAME
   ===================================================== */

function categoryName(category){

  const names = {

    tree:"Süni ağaclar",

    flower:"Güllər / Kompozisiya",

    wall:"Yaşıl divar",

    pot:"Dibçək"

  };


  return names[category] ||
    category;

}


/* =====================================================
   UPLOAD IMAGE
   ===================================================== */

async function uploadImage(
  file,
  folder="products"
){

  if(!file){

    if(folder === "portfolio"){

      return oldPortfolioImageUrl || "";

    }

    return oldImageUrl || "";

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const safeExtension =
    [
      "jpg",
      "jpeg",
      "png",
      "webp",
      "gif"
    ].includes(extension)

      ? extension

      : "jpg";


  const fileName =
    crypto.randomUUID() +
    "." +
    safeExtension;


  const path =
    folder +
    "/" +
    fileName;


  const {error} =
    await client.storage
      .from("product-images")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    throw new Error(
      "Şəkil yüklənmədi: " +
      error.message
    );

  }


  const {data} =
    client.storage
      .from("product-images")
      .getPublicUrl(path);


  return data.publicUrl;

}


/* =====================================================
   GET STORAGE PATH
   ===================================================== */

function getStoragePathFromUrl(url){

  if(!url) return null;


  try{

    const marker =
      "/storage/v1/object/public/product-images/";


    const index =
      url.indexOf(marker);


    if(index === -1){

      return null;

    }


    return decodeURIComponent(
      url.substring(
        index + marker.length
      )
    );

  }catch(error){

    return null;

  }

}


/* =====================================================
   DELETE STORAGE IMAGE
   ===================================================== */

async function deleteImageFromStorage(url){

  const path =
    getStoragePathFromUrl(url);


  if(!path){

    return;

  }


  const {error} =
    await client.storage
      .from("product-images")
      .remove([
        path
      ]);


  if(error){

    throw new Error(
      "Şəkil Storage-dan silinmədi: " +
      error.message
    );

  }

}


/* =====================================================
   SAVE / UPDATE PRODUCT
   ===================================================== */

productForm.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    clearStatus(
      formStatus
    );


    const saveBtn =
      document.getElementById(
        "saveBtn"
      );


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Yadda saxlanılır...";


    let newImageUrl = "";

    let newImageUploaded =
      false;


    try{

      const file =
        productImage.files[0];


      if(file){

        newImageUrl =
          await uploadImage(
            file,
            "products"
          );

        newImageUploaded =
          true;

      }else{

        newImageUrl =
          oldImageUrl || "";

      }


      const payload = {

        name:
          productName.value.trim(),

        category:
          productCategory.value,

        price:
          Number(
            productPrice.value || 0
          ),

        description:
          productDescription.value.trim(),

        image_url:
          newImageUrl

      };


      if(!payload.name){

        throw new Error(
          "Məhsul adını yaz."
        );

      }


      let result;


      /* UPDATE */

      if(editingId){

        result =
          await client
            .from("products")
            .update(payload)
            .eq(
              "id",
              editingId
            );


        if(result.error){

          throw result.error;

        }


        if(
          file &&
          oldImageUrl &&
          oldImageUrl !==
            newImageUrl
        ){

          try{

            await deleteImageFromStorage(
              oldImageUrl
            );

          }catch(storageError){

            console.warn(
              storageError.message
            );

          }

        }


        showStatus(
          formStatus,
          "Məhsul yeniləndi. ✅"
        );

      }


      /* INSERT */

      else{

        result =
          await client

/* =====================================================
   LOAD PORTFOLIO
   ===================================================== */

async function loadPortfolio(){

  portfolioList.innerHTML =
    '<div class="empty">Nümunələr yüklənir...</div>';


  const {data,error} =
    await client
      .from("portfolio")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    portfolioList.innerHTML =
      '<div class="empty">Xəta: ' +
      escapeHtml(
        error.message
      ) +
      '</div>';

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    portfolioList.innerHTML =
      '<div class="empty">' +
      'Hələ nümunə layihəsi yoxdur.' +
      '<br><br>' +
      'Yuxarıdan "Nümunə əlavə et" bölməsinə keç.' +
      '</div>';

    return;

  }


  portfolioList.innerHTML =
    data
      .map(item=>{

        const image =
          item.image_url

            ? `
              <img
                src="${escapeAttr(
                  item.image_url
                )}"
                alt="${escapeAttr(
                  item.title
                )}"
              >
              `

            : `
              <div
                style="
                  height:210px;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  background:#edf1ed;
                  font-size:50px
                ">
                🌿
              </div>
              `;


        return `
          <article
            class="card portfolio-card">

            ${image}

            <div class="card-body">

              <h3>
                ${escapeHtml(
                  item.title
                )}
              </h3>


              <p>
                ${escapeHtml(
                  item.description || ""
                )}
              </p>


              <div class="actions">

                <button
                  style="
                    background:#e9eee9;
                    color:#285b35
                  "
                  onclick="editPortfolio('${item.id}')">

                  Redaktə

                </button>


                <button
                  style="
                    background:#ffe9e9;
                    color:#a22
                  "
                  onclick="deletePortfolio('${item.id}')">

                  Sil

                </button>

              </div>

            </div>

          </article>
        `;

      })
      .join("");

}


/* =====================================================
   SAVE / UPDATE PORTFOLIO
   ===================================================== */

portfolioForm.addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    clearStatus(
      portfolioFormStatus
    );


    const saveBtn =
      document.getElementById(
        "portfolioSaveBtn"
      );


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      "Yadda saxlanılır...";


    let newImageUrl = "";

    let newImageUploaded =
      false;


    try{

      const file =
        portfolioImage.files[0];


      if(file){

        newImageUrl =
          await uploadImage(
            file,
            "portfolio"
          );

        newImageUploaded =
          true;

      }else{

        newImageUrl =
          oldPortfolioImageUrl ||
          "";

      }


      const payload = {

        title:
          portfolioTitle.value.trim(),

        description:
          portfolioDescription.value.trim(),

        image_url:
          newImageUrl

      };


      if(!payload.title){

        throw new Error(
          "Layihə adını yaz."
        );

      }


      if(
        !payload.image_url
      ){

        throw new Error(
          "Nümunə üçün şəkil seç."
        );

      }


      let result;


      /* UPDATE */

      if(editingPortfolioId){

        result =
          await client
            .from("portfolio")
            .update(payload)
            .eq(
              "id",
              editingPortfolioId
            );


        if(result.error){

          throw result.error;

        }


        if(
          file &&
          oldPortfolioImageUrl &&
          oldPortfolioImageUrl !==
            newImageUrl
        ){

          try{

            await deleteImageFromStorage(
              oldPortfolioImageUrl
            );

          }catch(storageError){

            console.warn(
              storageError.message
            );

          }

        }


        showStatus(
          portfolioFormStatus,
          "Nümunə yeniləndi. ✅"
        );

      }


      /* INSERT */

      else{

        result =
          await client
            .from("portfolio")
            .insert(
              payload
            );


        if(result.error){

          if(newImageUploaded){

            try{

              await deleteImageFromStorage(
                newImageUrl
              );

            }catch(cleanupError){

              console.warn(
                cleanupError.message
              );

            }

          }


          throw result.error;

        }


        showStatus(
          portfolioFormStatus,
          "Nümunə əlavə edildi. ✅"
        );

      }


      resetPortfolioForm();

      await loadPortfolio();


    }catch(error){

      showStatus(
        portfolioFormStatus,
        error.message ||
        "Naməlum xəta baş verdi.",
        false
      );


    }finally{

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "Nümunəni yadda saxla";

    }

  }
);

/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(value){

  return escapeHtml(
    value
  );

}
